<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html,body{margin:0;padding:0;background:#070b11;height:100%;width:100%;overflow:hidden}
  .tradingview-widget-container{height:100%;width:100%;background:#070b11}
  .tradingview-widget-container__widget{height:100%;width:100%}
</style>
</head>
<body>
<!-- TradingView Advanced Chart widget resmi (embed). Symbol/interval diisi dari Kotlin.
     FIX TV-01 (wajib di Kotlin TvWidgetHelper): escape __SYMBOL__/__INTERVAL__/__LOCALE__ dgn whitelist
       symbol: hanya [A-Z0-9:._/-]{1,32} (contoh BINANCE:BTCUSDT); selain itu fallback BINANCE:BTCUSDT.
       interval: whitelist {1,3,5,15,30,60,120,240,D,W,M}; selain itu fallback 15.
       locale: whitelist {id,en}; selain itu fallback id.
     Tanpa ini, string replace mentah rentan injection ("</script> breakout). Arah tujuan tidak diubah:
     tetap widget resmi TradingView, hanya input disanitasi. -->
<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
  <script type="text/javascript"
          src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
  {
    "autosize": true,
    "symbol": "__SYMBOL__",
    "interval": "__INTERVAL__",
    "timezone": "Asia/Jakarta",
    "theme": "dark",
    "style": "1",
    "locale": "__LOCALE__",
    "backgroundColor": "#070b11",
    "gridColor": "rgba(36,52,73,0.35)",
    "hide_side_toolbar": false,
    "allow_symbol_change": true,
    "withdateranges": true,
    "details": true,
    "hotlist": false,
    "calendar": false,
    "studies": [],
    "support_host": "https://www.tradingview.com"
  }
  </script>
</div>
</body>
</html>
